<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Arquitetura da ponte ao vivo</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#6b7280">A IA age na sua sessão E3D, com as suas permissões</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <g font-size="14">
    <rect x="30" y="120" width="170" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="115" y="158" text-anchor="middle" font-weight="700" fill="#312e81">Claude</text>
    <text x="115" y="180" text-anchor="middle" fill="#312e81">assistente</text>

    <rect x="240" y="120" width="170" height="90" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="325" y="158" text-anchor="middle" font-weight="700" fill="#164e63">Servidor MCP</text>
    <text x="325" y="180" text-anchor="middle" fill="#164e63">e3d_mcp.py</text>

    <rect x="450" y="120" width="170" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="535" y="152" text-anchor="middle" font-weight="700" fill="#14532d">HTTP localhost</text>
    <text x="535" y="174" text-anchor="middle" fill="#14532d">porta 8765 + token</text>

    <rect x="660" y="120" width="310" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="815" y="152" text-anchor="middle" font-weight="700" fill="#713f12">Add-in E3DLiveBridge</text>
    <text x="815" y="174" text-anchor="middle" fill="#713f12">dentro do E3D Design, thread de UI</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="200" y1="165" x2="238" y2="165"/>
    <line x1="410" y1="165" x2="448" y2="165"/>
    <line x1="620" y1="165" x2="658" y2="165"/>
  </g>
  <rect x="30" y="265" width="940" height="100" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="296" font-size="15" font-weight="700" fill="#1f2937">Regra de ouro: nada é gravado sem você</text>
  <text x="50" y="324" font-size="14" fill="#374151">Alterações ficam pendentes → você revisa → responde exatamente "SIM, GRAVAR" → só então a gravação acontece.</text>
  <text x="50" y="348" font-size="13" fill="#6b7280">Tudo roda como você, na sua sessão. Nenhum serviço privilegiado separado.</text>
</svg>
