<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Normas são limites, não padrão</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Cada item do catálogo tem um nível. O que a skill faz depende dele.</text>
  <g font-size="14">
    <rect x="30" y="95" width="225" height="210" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="142" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">BLOQUEIO</text>
    <text x="142" y="165" text-anchor="middle" fill="#7f1d1d">Não executa.</text>
    <text x="142" y="187" text-anchor="middle" fill="#7f1d1d">Só segue com</text>
    <text x="142" y="209" text-anchor="middle" fill="#7f1d1d">autorização</text>
    <text x="142" y="231" text-anchor="middle" fill="#7f1d1d">explícita e registrada.</text>
    <text x="142" y="278" text-anchor="middle" font-size="12" fill="#991b1b">ex.: gravar sem frase exata</text>

    <rect x="270" y="95" width="225" height="210" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="382" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">LIMITE</text>
    <text x="382" y="165" text-anchor="middle" fill="#78350f">Passa de um valor-</text>
    <text x="382" y="187" text-anchor="middle" fill="#78350f">limite da norma ativa.</text>
    <text x="382" y="209" text-anchor="middle" fill="#78350f">Informa o valor e</text>
    <text x="382" y="231" text-anchor="middle" fill="#78350f">pergunta o que fazer.</text>
    <text x="382" y="278" text-anchor="middle" font-size="12" fill="#92400e">ex.: vão entre suportes</text>

    <rect x="510" y="95" width="225" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="622" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">CONFIRMAR</text>
    <text x="622" y="165" text-anchor="middle" fill="#1e3a8a">Falta um dado.</text>
    <text x="622" y="187" text-anchor="middle" fill="#1e3a8a">Rotula como</text>
    <text x="622" y="209" text-anchor="middle" fill="#1e3a8a">Valor de Referência</text>
    <text x="622" y="231" text-anchor="middle" fill="#1e3a8a">ou pergunta. Nunca chuta.</text>
    <text x="622" y="278" text-anchor="middle" font-size="12" fill="#1e40af">ex.: spec não identificada</text>

    <rect x="750" y="95" width="220" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="860" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">ORIENTAÇÃO</text>
    <text x="860" y="165" text-anchor="middle" fill="#14532d">Boa prática.</text>
    <text x="860" y="187" text-anchor="middle" fill="#14532d">Menciona, sem</text>
    <text x="860" y="209" text-anchor="middle" fill="#14532d">bloquear.</text>
    <text x="860" y="278" text-anchor="middle" font-size="12" fill="#166534">ex.: clash antes de emitir</text>
  </g>
  <text x="500" y="325" text-anchor="middle" font-size="13" fill="#6b7280">Regra geral: se a norma ativa não define um valor, a skill pergunta. Não completa de memória.</text>
</svg>
