<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Exemplo: uma pergunta sobre o modelo</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Consulta não escreve nada. Só lê o E3D aberto.</text>
  <defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker></defs>
  <g font-size="14">
    <rect x="30" y="100" width="260" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="160" y="132" text-anchor="middle" font-weight="700" fill="#312e81">Pergunta do usuário</text>
    <text x="160" y="160" text-anchor="middle" font-style="italic" fill="#312e81">"What's piped or wired</text>
    <text x="160" y="182" text-anchor="middle" font-style="italic" fill="#312e81">to this equipment, and what's</text>
    <text x="160" y="204" text-anchor="middle" font-style="italic" fill="#312e81">left unconnected?"</text>

    <rect x="370" y="100" width="260" height="120" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="500" y="132" text-anchor="middle" font-weight="700" fill="#164e63">e3d_find, e3d_collect</text>
    <text x="500" y="160" text-anchor="middle" fill="#164e63">rastreia conexões</text>
    <text x="500" y="182" text-anchor="middle" fill="#164e63">do equipamento</text>
    <text x="500" y="204" text-anchor="middle" fill="#164e63">e lista os bocais livres</text>

    <rect x="710" y="100" width="260" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="840" y="132" text-anchor="middle" font-weight="700" fill="#14532d">Resposta citada</text>
    <text x="840" y="160" text-anchor="middle" fill="#14532d">o que está ligado,</text>
    <text x="840" y="182" text-anchor="middle" fill="#14532d">o que está livre,</text>
    <text x="840" y="204" text-anchor="middle" fill="#14532d">com a fonte de cada dado</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#c)">
    <line x1="292" y1="160" x2="368" y2="160"/>
    <line x1="632" y1="160" x2="708" y2="160"/>
  </g>
  <text x="500" y="262" text-anchor="middle" font-size="13" fill="#6b7280">Para escrever, o caminho é outro: lint, execução em transação, leitura de volta e verificação.</text>
</svg>
