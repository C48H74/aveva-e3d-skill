<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">O laço de validação em toda escrita</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Agir → observar → verificar → corrigir (até 3 vezes) → reportar</text>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4b5563"/></marker></defs>
  <g font-size="14" text-anchor="middle">
    <g>
      <rect x="20"  y="100" width="170" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="105" y="131" font-weight="700" fill="#312e81">1 ENTENDER</text><text x="105" y="153" fill="#312e81">cotas do documento</text>
      <rect x="215" y="100" width="170" height="70" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="300" y="131" font-weight="700" fill="#164e63">2 LER O MODELO</text><text x="300" y="153" fill="#164e63">o que já existe</text>
      <rect x="410" y="100" width="170" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="495" y="131" font-weight="700" fill="#14532d">3 PLANEJAR</text><text x="495" y="153" fill="#14532d">coordenadas e datum</text>
      <rect x="605" y="100" width="170" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="690" y="131" font-weight="700" fill="#713f12">4 LINT</text><text x="690" y="153" fill="#713f12">bloqueia erro conhecido</text>
      <rect x="800" y="100" width="180" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="890" y="131" font-weight="700" fill="#7c2d12">5 EXECUTAR</text><text x="890" y="153" fill="#7c2d12">transação desfazível</text>
    </g>
    <g>
      <rect x="800" y="210" width="180" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="890" y="241" font-weight="700" fill="#831843">6 LER DE VOLTA</text><text x="890" y="263" fill="#831843">extensão real</text>
      <rect x="605" y="210" width="170" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="690" y="241" font-weight="700" fill="#4c1d95">7 VERIFICAR</text><text x="690" y="263" fill="#4c1d95">contra o documento</text>
      <rect x="410" y="210" width="170" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="495" y="241" font-weight="700" fill="#7f1d1d">8 CORRIGIR</text><text x="495" y="263" fill="#7f1d1d">no máximo 3 vezes</text>
      <rect x="215" y="210" width="170" height="70" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="300" y="241" font-weight="700" fill="#111827">9 REPORTAR</text><text x="300" y="263" fill="#111827">o que foi feito</text>
      <rect x="20"  y="210" width="170" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="105" y="241" font-weight="700" fill="#064e3b">10 GRAVAR</text><text x="105" y="263" fill="#064e3b">só com "SIM, GRAVAR"</text>
    </g>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#b)">
    <line x1="190" y1="135" x2="213" y2="135"/>
    <line x1="385" y1="135" x2="408" y2="135"/>
    <line x1="580" y1="135" x2="603" y2="135"/>
    <line x1="775" y1="135" x2="798" y2="135"/>
    <path d="M890,172 L890,190"/>
    <line x1="800" y1="245" x2="777" y2="245"/>
    <line x1="605" y1="245" x2="582" y2="245"/>
    <line x1="410" y1="245" x2="387" y2="245"/>
    <line x1="215" y1="245" x2="192" y2="245"/>
  </g>
  <text x="500" y="318" text-anchor="middle" font-size="13" fill="#6b7280">Se a verificação falhar após 3 correções, a skill para e reporta. Não grava nada.</text>
</svg>
